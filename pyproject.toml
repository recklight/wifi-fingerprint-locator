[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-fingerprint-locator"
version = "0.1.0"
description = "WiFi CSI fingerprint indoor localization: decodes Intel 5300 beamforming reports, builds amplitude, sanitized-phase and real-imaginary fingerprints, and compares neural-network position regression under packet, location and temporal splits."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RL" }]
maintainers = [{ name = "RL" }]
keywords = [
    "wifi",
    "channel-state-information",
    "indoor-localization",
    "fingerprinting",
    "intel-5300",
    "phase-sanitization",
    "neural-network",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Everything the package imports at module level is listed, even when another
# requirement already pulls it in (joblib arrives with scikit-learn, but the
# package imports it directly).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.2", "ruff>=0.4"]

[project.scripts]
wifi-fingerprint-locator = "wifi_fingerprint_locator.cli:main"

[project.urls]
Homepage = "https://github.com/recklight/wifi-fingerprint-locator"
Repository = "https://github.com/recklight/wifi-fingerprint-locator"
Issues = "https://github.com/recklight/wifi-fingerprint-locator/issues"
Changelog = "https://github.com/recklight/wifi-fingerprint-locator/blob/master/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wifi_fingerprint_locator = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.2"
testpaths = ["tests", "src"]
# "src" makes the package importable straight from a checkout, without installing.
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config --doctest-modules"
# Unit tests train tiny networks for a handful of iterations on purpose.
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.format]
# Ruff 0.16+ also formats code blocks in Markdown; the README examples are aligned by hand.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# The documentation tests match Traditional Chinese text, which uses full-width
# punctuation.
allowed-confusables = ["（", "）", "，", "：", "；", "！", "？", "／"]
